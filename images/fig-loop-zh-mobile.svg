<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 670" width="390" height="670" role="img" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>AI harness 的讀取、修改、測試迴圈</title><desc>六個步驟由上而下：模型要求讀檔、harness 呼叫工具帶回內容、模型要求改程式、編輯工具套用修改、模型要求跑測試、結果回饋給模型再試一次；整個迴圈由 harness 管理何時繼續、停止或求助。</desc>
<rect width="390" height="670" fill="#fbf8f3"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a6f4d"/></marker></defs>
<rect x="30" y="20" width="330" height="60" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="195.0" y="56.3" text-anchor="middle" font-size="18" fill="#2b2118">模型要求讀檔</text><line x1="195" y1="80" x2="195" y2="110" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="112" width="330" height="60" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="195.0" y="148.3" text-anchor="middle" font-size="18" fill="#2b2118">harness 呼叫工具，帶回內容</text><line x1="195" y1="172" x2="195" y2="202" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="204" width="330" height="60" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="195.0" y="240.3" text-anchor="middle" font-size="18" fill="#2b2118">模型要求改程式</text><line x1="195" y1="264" x2="195" y2="294" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="296" width="330" height="60" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="195.0" y="332.3" text-anchor="middle" font-size="18" fill="#2b2118">編輯工具套用修改</text><line x1="195" y1="356" x2="195" y2="386" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="388" width="330" height="60" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="195.0" y="424.3" text-anchor="middle" font-size="18" fill="#2b2118">模型要求跑測試</text><line x1="195" y1="448" x2="195" y2="478" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="480" width="330" height="60" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="195.0" y="516.3" text-anchor="middle" font-size="18" fill="#2b2118">結果回饋給模型，再試一次</text><rect x="30" y="586" width="330" height="64" rx="12" fill="#f4e4d4" stroke="#8a6f4d" stroke-width="2"/><text x="195.0" y="623.6" text-anchor="middle" font-size="16" fill="#2b2118" font-weight="700">由 harness 管理：何時繼續、何時停止、何時求助</text></svg>
