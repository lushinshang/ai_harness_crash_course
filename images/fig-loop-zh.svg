<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
<title>AI harness 的讀取、修改、測試迴圈</title><desc>六個步驟：模型要求讀檔、harness 呼叫工具帶回內容、模型要求改程式、編輯工具套用修改、模型要求跑測試、結果回饋給模型再試一次；整個迴圈由 harness 管理何時繼續、停止或求助。</desc>
<rect width="960" height="400" fill="#fbf8f3"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a6f4d"/></marker></defs>
<rect x="40" y="40" width="280" height="80" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="180.0" y="86.3" text-anchor="middle" font-size="18" fill="#2b2118">模型要求讀檔</text><rect x="340" y="40" width="280" height="80" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="480.0" y="86.3" text-anchor="middle" font-size="18" fill="#2b2118">harness 呼叫工具，帶回內容</text><rect x="640" y="40" width="280" height="80" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="780.0" y="86.3" text-anchor="middle" font-size="18" fill="#2b2118">模型要求改程式</text><rect x="640" y="190" width="280" height="80" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="780.0" y="236.3" text-anchor="middle" font-size="18" fill="#2b2118">編輯工具套用修改</text><rect x="340" y="190" width="280" height="80" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="480.0" y="236.3" text-anchor="middle" font-size="18" fill="#2b2118">模型要求跑測試</text><rect x="40" y="190" width="280" height="80" rx="12" fill="#ffffff" stroke="#8a6f4d" stroke-width="2"/><text x="180.0" y="236.3" text-anchor="middle" font-size="18" fill="#2b2118">結果回饋給模型，再試一次</text><line x1="320" y1="80" x2="338" y2="80" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><line x1="620" y1="80" x2="638" y2="80" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><line x1="780" y1="120" x2="780" y2="188" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><line x1="638" y1="230" x2="620" y2="230" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><line x1="338" y1="230" x2="320" y2="230" stroke="#8a6f4d" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="310" width="880" height="56" rx="12" fill="#f4e4d4" stroke="#8a6f4d" stroke-width="2"/><text x="480.0" y="344.3" text-anchor="middle" font-size="18" fill="#2b2118" font-weight="700">由 harness 管理：何時繼續、何時停止、何時求助</text></svg>
